<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Andre Amidu | Live Global News</title>
    <!-- External UI Frameworks -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --cnn-red: #cc0000;
            --grace-purple: #6f42c1;
            --dark-bg: #1a1a1a;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .text-purple { color: var(--grace-purple); }
        .fw-black { font-weight: 900; }
        
        /* Navbar Branding */
        .navbar-brand {
            font-size: 1.8rem;
            letter-spacing: -1.5px;
            color: #000 !important;
        }

        .nav-link {
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 10px 15px !important;
            transition: 0.3s;
            color: #333 !important;
        }

        .nav-link:hover {
            color: var(--grace-purple) !important;
            background: #eee;
        }

        /* Breaking Ticker */
        .ticker-container {
            background: #000;
            color: #fff;
            overflow: hidden;
            white-space: nowrap;
            padding: 8px 0;
        }

        .ticker-wrap {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 60s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .ticker-item {
            display: inline-block;
            padding: 0 2rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        /* Hero Section */
        .hero-overlay {
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0) 100%);
        }

        /* Cards */
        .news-card {
            border: none;
            border-radius: 0;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .news-card:hover {
            transform: translateY(-5px);
        }

        .card-img-top {
            height: 200px;
            object-fit: cover;
            border-radius: 0;
        }

        .category-tag {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--cnn-red);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--grace-purple); }

        .spinner-container {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Breaking News Ticker -->
    <div class="ticker-container sticky-top" style="top: 0; z-index: 1030;">
        <div class="container d-flex align-items-center">
            <span class="badge bg-danger me-3" style="z-index: 10;">BREAKING</span>
            <div class="ticker-wrap" id="ticker-news">
                <span class="ticker-item">SATELLITE LINK ESTABLISHED...</span>
                <span class="ticker-item">FETCHING GLOBAL HEADLINES...</span>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-black" href="#" onclick="loadCategory('top')">
                <span class="text-purple">GRACE</span> AMIDU <span class="fs-6 fw-normal text-secondary">NEWS</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto fw-bold">
                    <li class="nav-item"><a class="nav-link" href="#" onclick="loadCategory('africa')">AFRICA</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="loadCategory('world')">USA & WORLD</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="loadCategory('sports')">SPORTS</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="loadCategory('entertainment')">ENTERTAINMENT</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="app-root">
        <!-- Hero Story -->
        <div id="hero-section"></div>

        <!-- News Grid -->
        <div class="container mt-5">
            <h4 class="fw-bold mb-4 border-start border-4 border-danger ps-3" id="category-title">LATEST STORIES</h4>
            <div class="row g-4" id="news-grid">
                <!-- Content injected via JS -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-white py-5 mt-5">
        <div class="container text-center">
            <h3 class="fw-bold mb-3">GRACE AMIDU <span class="text-purple">DIGITAL</span></h3>
            <p class="text-secondary small">The Carrier of Breaking News & Live Satellite Feeds &copy; 2026</p>
            <div class="fs-4 mt-4">
               <!-- Facebook -->
                <a href="https://www.facebook.com/GraceAmiduMw" target="_blank" class="text-white mx-3">
                <i class="fab fa-facebook-f"></i>
                </a>

                <!-- Twitter (X) -->
                <a href="https://x.com/yourusername" target="_blank" class="text-white mx-3">
                <i class="fab fa-twitter"></i>
                </a>

                <!-- YouTube -->
                <a href="https://youtube.com/@tiyanjaneamidu-eg1qq" target="_blank" class="text-white mx-3">
                <i class="fab fa-youtube"></i>
                </a>
                <a href="https://wa.me/265888151727" target="_blank" class="text-white mx-3">
                  <i class="fab fa-whatsapp"></i>
                </a>
            </div>
            <div class="mt-4 small text-secondary">
                <a href="#" class="text-decoration-none text-secondary me-3">Terms of Use</a>
                <a href="#" class="text-decoration-none text-secondary">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <script>
        // Use a real API key here if you have one, or use the mock data below for the "Outcome" preview
        const API_KEY = ''; 
        const baseUrl = `https://newsdata.io/api/1/news?apikey=${API_KEY}&language=en`;

        // Real news data from March 2026 for the preview
        const mockData = {
            africa: [
                {
                    title: "Malawi Parliament Proposes Dollar Payments for Foreign Mining Investors",
                    description: "A powerful proposal from Parliament has ignited a push to overhaul Malawi's mining sector, demanding higher fees and dollar-based transactions to boost forex reserves.",
                    image_url: "https://images.unsplash.com/photo-1519452635265-7b1fbfd1e4e0?q=80&w=1000",
                    link: "#",
                    category: ["Malawi"],
                    source: "Nyasa Times"
                },
                {
                    title: "K22bn Road Revenue Target Sparks 'Revenue Policing' Fears",
                    description: "Malawi motorists brace for tighter scrutiny as the Police Service is handed a steep K22 billion fine collection target in the new budget.",
                    image_url: "https://images.unsplash.com/photo-1542362567-b051c63b5d56?q=80&w=1000",
                    link: "#",
                    category: ["Local"],
                    source: "Daily Times"
                },
                {
                    title: "Ethiopian Airlines to Deploy First Boeing 777-300ERSF in Africa",
                    description: "The 'Big Twin' freighter will operate via hubs in Lilongwe and Lusaka, significantly boosting regional cargo capacity.",
                    image_url: "https://images.unsplash.com/photo-1569154941061-e231b4725ef1?q=80&w=1000",
                    link: "#",
                    category: ["Aviation"],
                    source: "AllAfrica"
                }
            ],
            sports: [
                {
                    title: "CAF Strips Senegal of AFCON Title, Declares Morocco Winner",
                    description: "In a stunning ruling, CAF appeals judges have overturned Senegal's victory following a chaotic final protest, sparking debate across African football.",
                    image_url: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1000",
                    link: "#",
                    category: ["AFCON"],
                    source: "SuperSport"
                },
                {
                    title: "Eritrea Ends 18-Year Isolation with AFCON Qualifier vs Eswatini",
                    description: "The East African nation returns to international competitive football for the first time since 2008.",
                    image_url: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1000",
                    link: "#",
                    category: ["Football"],
                    source: "BBC Sport"
                }
            ],
            world: [
                {
                    title: "EU and Australia Sign Strategic Milestone Trade Deal",
                    description: "Europe strengthens its strategic autonomy with a landmark security and defense partnership alongside a comprehensive free trade agreement.",
                    image_url: "https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?q=80&w=1000",
                    link: "#",
                    category: ["Global"],
                    source: "Reuters"
                }
            ],
            entertainment: [
                {
                    title: "Kuami Eugene Crowned Highlife King as 2026 TGMAs Approach",
                    description: "Controversy and celebration collide in Ghana's music scene as legendary figures back the new era of Highlife music.",
                    image_url: "https://images.unsplash.com/photo-1493225255756-d9584f8606e9?q=80&w=1000",
                    link: "#",
                    category: ["Music"],
                    source: "GhanaWeb"
                }
            ]
        };

        async function loadCategory(category) {
            const grid = document.getElementById('news-grid');
            const hero = document.getElementById('hero-section');
            const ticker = document.getElementById('ticker-news');
            const title = document.getElementById('category-title');

            title.innerText = category.toUpperCase() + " HEADLINES";
            grid.innerHTML = '<div class="spinner-container w-100"><div class="spinner-border text-primary"></div></div>';

            // Simulate Network Delay
            setTimeout(() => {
                const news = mockData[category] || mockData.africa;
                
                // 1. Update Ticker
                ticker.innerHTML = news.map(n => `<span class="ticker-item">${n.title.toUpperCase()}</span>`).join('');

                // 2. Update Hero Story
                const topStory = news[0];
                hero.innerHTML = `
                    <div class="position-relative text-white" style="height: 70vh; min-height: 400px; overflow: hidden;">
                        <img src="${topStory.image_url}" class="w-100 h-100" style="object-fit: cover;">
                        <div class="position-absolute top-0 start-0 w-100 h-100 hero-overlay"></div>
                        <div class="position-absolute bottom-0 start-0 p-4 p-md-5 w-100 w-md-75">
                            <span class="badge bg-danger mb-2">LIVE REPORT</span>
                            <h1 class="display-4 fw-bold lh-1">${topStory.title}</h1>
                            <p class="lead d-none d-md-block">${topStory.description}</p>
                            <a href="${topStory.link}" class="btn btn-danger btn-lg rounded-0 px-4 mt-3">FULL STORY</a>
                        </div>
                    </div>
                `;

                // 3. Update Grid
                grid.innerHTML = news.map(item => `
                    <div class="col-md-4">
                        <div class="card h-100 news-card shadow-sm">
                            <img src="${item.image_url}" class="card-img-top">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="category-tag">${item.category[0]}</span>
                                    <small class="text-muted">${item.source}</small>
                                </div>
                                <h5 class="card-title fw-bold mb-3">${item.title}</h5>
                                <p class="card-text text-secondary small">${item.description.substring(0, 100)}...</p>
                                <hr>
                                <a href="${item.link}" class="text-decoration-none text-dark fw-bold small">
                                    READ MORE <i class="fas fa-arrow-right ms-1 text-danger"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 800);
        }

        // Initialize
        window.onload = () => loadCategory('africa');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
